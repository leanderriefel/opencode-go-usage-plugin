name: ci

on:
  push:
    branches: [main, master, dev, "beta*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - name: Check dist not dirty
        run: git diff --exit-code -- dist || (echo "dist/ is out of date -- run npm run build and commit" && exit 1)
